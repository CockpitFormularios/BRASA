<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Inspeção de Extintor — Visualização</title>
  
  <link rel="icon" type="image/png" href="https://vludpyhesuyajwqmtlvs.supabase.co/storage/v1/object/public/LOGO/iconeBRASA.png" />
  
  <style>
    :root {
      --vermelho: #e63946;
      --laranja: #f77f00;
      --escuro: #1a1a1a;
      --cinza: #f5f5f5;
      --cinza-borda: #e5e7eb;
      --texto-suave: #6b7280;
      --sombra: 0 4px 12px rgba(0,0,0,.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--cinza);
      color: var(--escuro);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* HEADER */
    .header-pub {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      box-shadow: var(--sombra);
      border-top: 5px solid var(--vermelho);
    }
    .header-pub img {
      height: 40px;
      object-fit: contain;
      margin-bottom: 12px;
    }
    .header-pub h1 {
      font-size: 1.4rem;
      color: var(--vermelho);
      margin-bottom: 4px;
    }
    .header-pub p {
      font-size: 0.9rem;
      color: var(--texto-suave);
    }

    /* CARD EXTINTOR */
    .extintor-info {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      box-shadow: var(--sombra);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .extintor-info .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--cinza-borda);
      padding-bottom: 10px;
      margin-bottom: 4px;
    }
    .extintor-info h2 { font-size: 1.2rem; }
    .extintor-info .dados { font-size: 0.9rem; color: #444; }

    /* HISTÓRICO DE INSPEÇÕES */
    .titulo-secao {
      font-size: 1.1rem;
      font-weight: 700;
      margin-top: 10px;
      margin-bottom: 4px;
      color: var(--escuro);
    }

    .hist-meses-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .hist-mes-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff;
      border: 1px solid var(--cinza-borda);
      border-radius: 10px;
      padding: 16px;
      box-shadow: var(--sombra);
    }
    .hist-mes-titulo {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--escuro);
      text-transform: capitalize;
    }
    .hist-mes-acoes {
      display: flex;
      gap: 8px;
    }
    .btn-mes {
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .btn-mes-ver { background: #e0f2fe; color: #0369a1; }
    .btn-mes-ver:hover { background: #bae6fd; }

    /* MODAL PARA O DETALHE COMPLETO */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.6);
      display: none; align-items: center; justify-content: center;
      z-index: 1000; padding: 20px;
    }
    .modal-overlay.aberto { display: flex; }
    
    .modal {
      background: #fff; border-radius: 16px; width: 100%;
      max-width: 800px; 
      max-height: 90vh; 
      display: flex; flex-direction: column;
      box-shadow: 0 20px 50px rgba(0,0,0,.3);
      animation: slideUp .2s ease;
      overflow: hidden;
    }
    
    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    
    .modal-header {
      padding: 20px 24px; border-bottom: 1px solid var(--cinza-borda);
      display: flex; justify-content: space-between; align-items: center;
      flex-shrink: 0;
    }
    .modal-header h3 { font-size: 1.1rem; }
    .modal-close {
      background: none; border: none; font-size: 1.4rem;
      cursor: pointer; color: var(--texto-suave); line-height: 1;
    }
    .modal-close:hover { color: var(--vermelho); }
    .modal-body { padding: 20px 24px; overflow-y: auto; flex: 1; }

    /* DETALHES DA INSPEÇÃO (Visualização) */
    .hist-detalhe-card {
      border: 1px solid var(--cinza-borda); border-radius: 12px;
      padding: 16px; margin-bottom: 16px; background: #fff;
    }
    .hist-detalhe-card:last-child { margin-bottom: 0; }
    
    .hist-header {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--cinza-borda); padding-bottom: 12px; margin-bottom: 12px;
    }
    .hist-data { font-size: 1.05rem; font-weight: 700; color: var(--escuro); }
    .hist-mes { font-size: 0.85rem; color: var(--vermelho); font-weight: 600; margin-top: 2px; }
    .hist-inspetor { font-size: .8rem; color: var(--texto-suave); margin-top: 4px; }
    
    .badge {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
    }
    .badge.conforme { background: #dcfce7; color: #166534; }
    .badge.nao_conforme { background: #fee2e2; color: #991b1b; }

    .checklist-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 6px; list-style: none; margin-bottom: 16px;
    }
    .checklist-grid li {
      font-size: .8rem; color: #444; background: #f9f9f9;
      padding: 4px 8px; border-radius: 6px;
    }

    .obs-box {
      font-size: 0.85rem;
      background: #f0f9ff;
      padding: 10px;
      border-radius: 8px;
      border-left: 3px solid #0284c7;
      margin-bottom: 16px;
    }

    .fotos-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .foto-item {
      display: block; border-radius: 8px; overflow: hidden;
      border: 1px solid var(--cinza-borda); position: relative; cursor: zoom-in;
    }
    .foto-item img {
      width: 100%; height: 120px; object-fit: cover;
      display: block; transition: transform .2s;
    }
    .foto-item:hover img { transform: scale(1.05); }
    .foto-item span {
      display: block; font-size: .75rem; text-align: center; padding: 6px;
      background: var(--cinza); color: var(--texto-suave); font-weight: 600;
    }

    /* LIGHTBOX */
    .lightbox {
      position: fixed; inset: 0; background: rgba(0,0,0,0.9);
      display: none; align-items: center; justify-content: center;
      z-index: 3000; cursor: zoom-out; padding: 20px;
    }
    .lightbox.aberto { display: flex; }
    .lightbox img {
      max-width: 100%; max-height: 100%; object-fit: contain;
      border-radius: 8px;
    }

    /* LOADING E VAZIO */
    .loading { text-align: center; padding: 40px; font-weight: 600; color: var(--texto-suave); }
    .vazio { text-align: center; padding: 30px; color: var(--texto-suave); background: #fff; border-radius: 12px; }

    @media (max-width: 600px) {
      .checklist-grid { grid-template-columns: 1fr; }
      .fotos-grid { grid-template-columns: 1fr; }
      body { padding: 10px; }
      .hist-mes-card { flex-direction: column; align-items: flex-start; gap: 12px; }
      .hist-mes-acoes { width: 100%; justify-content: space-between; }
      .btn-mes { flex: 1; justify-content: center; }
      .modal { height: 95vh; max-height: 100vh; border-radius: 20px 20px 0 0; margin-top: auto; }
    }
  </style>
</head>
<body>

  <div class="container" id="app-container">
    <div class="loading">Carregando informações do extintor...</div>
  </div>

  <!-- Modal para visualizar a inspeção completa do mês -->
  <div class="modal-overlay" id="modal-detalhe">
    <div class="modal">
      <div class="modal-header">
        <h3>📅 Inspeção — <span id="detalhe-mes-titulo"></span></h3>
        <button class="modal-close" onclick="fecharModal()">✕</button>
      </div>
      <div class="modal-body" id="detalhe-corpo">
        <!-- Conteúdo inserido via JS -->
      </div>
    </div>
  </div>

  <!-- Lightbox para ampliar as fotos -->
  <div class="lightbox" id="lightbox">
    <img src="" alt="Zoom da Foto" id="lightbox-img" />
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const supabase = createClient(
      'https://vludpyhesuyajwqmtlvs.supabase.co',
      'sb_publishable_X-uj41aebGg54ezG85Ffxw_JUz7S5wE'
    );

    const container = document.getElementById('app-container');
    let inspecoesAgrupadas = {}; // Armazena os dados para o modal

    function formatarMesAno(mesRef) {
      if (!mesRef) return 'Não informado';
      const [ano, mes] = mesRef.split('-');
      const nomesMeses = [
        "Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", 
        "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"
      ];
      return `${nomesMeses[parseInt(mes)-1]} de ${ano}`;
    }

    const urlParams = new URLSearchParams(window.location.search);
    const extintorId = urlParams.get('extintor');

    if (!extintorId) {
      container.innerHTML = '<div class="vazio">Nenhum extintor selecionado. Escaneie o QR Code novamente.</div>';
    } else {
      carregarDados();
    }

    async function carregarDados() {
      try {
        const { data: extintor, error: errExt } = await supabase
          .from('extintores')
          .select('*')
          .eq('id', extintorId)
          .single();

        if (errExt) throw new Error("Erro ao buscar extintor no banco.");

        if (!extintor) {
           container.innerHTML = '<div class="vazio">Extintor não encontrado no sistema.</div>';
           return;
        }

        const { data: inspecoes, error: errInsp } = await supabase
          .from('inspecoes')
          .select('*')
          .eq('extintor_id', extintorId)
          .order('data_inspecao', { ascending: false });

        if (errInsp) throw new Error("Erro ao buscar inspeções no banco.");

        renderizar(extintor, inspecoes);

      } catch (err) {
        console.error(err);
        container.innerHTML = `<div class="vazio">❌ ${err.message}</div>`;
      }
    }

    function renderizar(ext, inspecoes) {
      // 1. Cabeçalho e Info do Extintor
      let html = `
        <div class="header-pub">
          <img src="https://rvtquhqeivrhcdoreghu.supabase.co/storage/v1/object/public/cipa-branding/logo-inspefrot.png" alt="Logo Empresa" onerror="this.style.display='none'">
          <h1>Histórico de Inspeções</h1>
          <p>Consulte abaixo as verificações mensais realizadas.</p>
        </div>

        <div class="extintor-info">
          <div class="top">
            <h2>🧯 Nº ${ext.numero}</h2>
          </div>
          <div class="dados"><strong>Tipo:</strong> ${ext.tipo}</div>
          <div class="dados"><strong>Capacidade:</strong> ${ext.capacidade}</div>
          <div class="dados"><strong>Local:</strong> ${ext.setor || '-'} ${ext.local ? ' - ' + ext.local : ''}</div>
          <div class="dados"><strong>Vencimento do Equipamento:</strong> ${new Date(ext.data_validade + 'T12:00:00').toLocaleDateString('pt-BR')}</div>
        </div>

        <div class="titulo-secao">📋 Meses com Inspeções</div>
      `;

      // 2. Agrupar os meses
      if (!inspecoes || inspecoes.length === 0) {
        html += `<div class="vazio">Nenhuma inspeção registrada para este extintor.</div>`;
      } else {
        inspecoesAgrupadas = {};
        inspecoes.forEach(insp => {
          let ref = insp.mes_referencia;
          if (!ref) {
            const dt = new Date(insp.data_inspecao);
            ref = `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}`;
          }
          if (!inspecoesAgrupadas[ref]) inspecoesAgrupadas[ref] = [];
          inspecoesAgrupadas[ref].push(insp);
        });

        let htmlMeses = '<div class="hist-meses-container">';
        Object.keys(inspecoesAgrupadas).forEach(ref => {
          const [ano, mes] = ref.split('-');
          const nomeMes = formatarMesAno(ref);
          const totalInsp = inspecoesAgrupadas[ref].length;

          htmlMeses += `
            <div class="hist-mes-card">
              <div>
                <div class="hist-mes-titulo">${nomeMes}</div>
                <div style="font-size:0.8rem; color:var(--texto-suave); margin-top:4px;">
                  ${totalInsp} inspeção(ões) registrada(s)
                </div>
              </div>
              <div class="hist-mes-acoes">
                <button class="btn-mes btn-mes-ver" onclick="verDetalhesMes('${ref}')">
                  👁️ Ver
                </button>
              </div>
            </div>
          `;
        });
        htmlMeses += '</div>';
        html += htmlMeses;
      }

      container.innerHTML = html;
    }

    // 3. Função para abrir o modal com os detalhes
    window.verDetalhesMes = function(ref) {
      const inspecoesDoMes = inspecoesAgrupadas[ref];
      if (!inspecoesDoMes) return;

      document.getElementById('detalhe-mes-titulo').textContent = formatarMesAno(ref);
      const containerDetalhe = document.getElementById('detalhe-corpo');

      containerDetalhe.innerHTML = inspecoesDoMes.map(i => {
        const dtObj = new Date(i.data_inspecao);
        const dataFormatada = dtObj.toLocaleDateString('pt-BR');
        const horaFormatada = dtObj.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        const isConforme = i.resultado === 'conforme';

        const itens = i.checklist ? Object.entries(i.checklist).map(([k, v]) =>
          `<li>${v ? '✅' : '❌'} ${k.replace('_ok','').replace(/_/g,' ')}</li>`
        ).join('') : '';

        let fotosHtml = '';
        if (i.foto_inteiro_url || i.foto_selo_url) {
          fotosHtml = `<div class="fotos-grid">
            ${i.foto_inteiro_url ? `
              <div class="foto-item" onclick="abrirZoom('${i.foto_inteiro_url}')">
                <img src="${i.foto_inteiro_url}" alt="Extintor inteiro" />
                <span>🧯 Extintor Inteiro</span>
              </div>` : ''}
            ${i.foto_selo_url ? `
              <div class="foto-item" onclick="abrirZoom('${i.foto_selo_url}')">
                <img src="${i.foto_selo_url}" alt="Selo de validade" />
                <span>🏷️ Selo de Validade</span>
              </div>` : ''}
          </div>`;
        }

        return `
          <div class="hist-detalhe-card">
            <div class="hist-header">
              <div>
                <div class="hist-data">Realizada em: ${dataFormatada} às ${horaFormatada}</div>
                <div class="hist-inspetor">👤 Inspetor: ${i.inspetor || '-'}</div>
              </div>
              <div>
                <span class="badge ${isConforme ? 'conforme' : 'nao_conforme'}">
                  ${isConforme ? 'Conforme' : 'Não Conforme'}
                </span>
              </div>
            </div>
            
            <ul class="checklist-grid">${itens}</ul>
            
            ${i.observacoes ? `<div class="obs-box"><strong>💬 Obs:</strong> ${i.observacoes}</div>` : ''}
            
            ${fotosHtml}
          </div>
        `;
      }).join('');

      document.getElementById('modal-detalhe').classList.add('aberto');
    }

    window.fecharModal = function() {
      document.getElementById('modal-detalhe').classList.remove('aberto');
    }

    // Lógica do Lightbox (Zoom nas fotos)
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');

    lightbox.addEventListener('click', () => {
      lightbox.classList.remove('aberto');
      setTimeout(() => { lightboxImg.src = ''; }, 300);
    });

    window.abrirZoom = function(url) {
      lightboxImg.src = url;
      lightbox.classList.add('aberto');
    }

  </script>
</body>
</html>
